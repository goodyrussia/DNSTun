name: Build DNSTun APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "sdk.dir=$SDK" > app/local.properties
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-37" > /dev/null 2>&1 || true
            "$SDKMGR" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Build release APK
        env:
          DNSTUN_KEYSTORE: ${{ secrets.DNSTUN_KEYSTORE_B64 != '' && '/tmp/release.jks' || '' }}
          DNSTUN_STORE_PASSWORD: ${{ secrets.DNSTUN_STORE_PASSWORD }}
          DNSTUN_KEY_ALIAS: ${{ secrets.DNSTUN_KEY_ALIAS }}
          DNSTUN_KEY_PASSWORD: ${{ secrets.DNSTUN_KEY_PASSWORD }}
          KS_B64: ${{ secrets.DNSTUN_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.jks
            echo "keystore: $(ls -l /tmp/release.jks)"
          else
            echo "no keystore secret - building unsigned"
            export DNSTUN_KEYSTORE=""
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          if [ -n "${{ secrets.DNSTUN_KEYSTORE_B64 }}" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
            "$BT/apksigner" verify --verbose "$APK" || true
          fi
          cp "$APK" /tmp/DNSTun.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSTun-apk
          path: /tmp/DNSTun.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/DNSTun.apk
          generate_release_notes: true
