name: Build DNSTun APK

on:
  push:
    branches: [slipnet, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platform-tools" > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" > /dev/null 2>&1 || true
            "$SDKMGR" "build-tools;36.0.0" > /dev/null 2>&1 || true
            "$SDKMGR" "ndk;29.0.14206865" > /dev/null 2>&1 || true
          fi
          ls "$SDK/ndk" || true

      - name: Write signing config
        env:
          KS_B64: ${{ secrets.DNSTUN_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DNSTUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DNSTUN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DNSTUN_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            echo "signing keystore ready"
          else
            echo "no keystore secret — release build will be unsigned"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          ls -l "$APK"
          unzip -Z1 "$APK" | grep -q "classes.dex"
          unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/libgojni.so"
          unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --verbose "$APK" || true
          cp "$APK" /tmp/DNSTun.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSTun-apk
          path: /tmp/DNSTun.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/DNSTun.apk
          generate_release_notes: true
